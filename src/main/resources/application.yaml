server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: clef

  main:
    lazy-initialization: true

  datasource:
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "${FRONTEND_URL}/api/login/oauth2/code/{registrationId}"
          google-reset:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "${FRONTEND_URL}/api/login/oauth2/code/google-reset"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "${FRONTEND_URL}/api/login/oauth2/code/{registrationId}"
          github-reset:
            provider: github
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "${FRONTEND_URL}/api/login/oauth2/code/github-reset"

  jpa:
    open-in-view: false # Prevents database connection exhaustion in a large-scale userbase

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

frontend:
  url: ${FRONTEND_URL}
  oauth2-redirect-path: /dashboard
  oauth2-2fa-redirect-path: /2fa-verify
  reset-password-redirect-path: /reset-password

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  verify:
    service-sid: ${TWILIO_SERVICE_SID}

supabase:
  storage:
    endpoint: https://jltgdpidtmnsmlvcmnol.storage.supabase.co/storage/v1/s3
    public-url: https://jltgdpidtmnsmlvcmnol.supabase.co/storage/v1/object/public
    region: ap-southeast-2
    access-key: ${SUPABASE_ACCESS_KEY}
    secret-key: ${SUPABASE_SECRET_KEY}
    files-bucket: clef-files
    avatars-bucket: clef-avatars

gemini:
  api:
    url: ${GEMINI_API_URL}
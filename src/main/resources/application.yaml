server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: clef

  datasource:
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email

  jpa:
    open-in-view: false # Prevents database connection exhaustion in a large-scale userbase

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

frontend:
  url: ${FRONTEND_URL}
  oauth2-redirect-path: /dashboard
  oauth2-2fa-redirect-path: /2fa-verify

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  verify:
    service-sid: ${TWILIO_SERVICE_SID}

